<!doctype html>
<!-- PROTOTYPE harness: approximates the Wealthfolio host (Flexoki light theme, Tailwind v4, Inter). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allocation prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      @theme {
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      @theme inline {
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --spacing-input-height: var(--input-height);
        --spacing-button-height: var(--button-height);
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-success: var(--success);
        --color-success-foreground: var(--success-foreground);
        --color-warning: var(--warning);
        --color-warning-foreground: var(--warning-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-input-bg: var(--input-bg);
        --color-ring: var(--ring);
        --color-sidebar: var(--sidebar);
        --color-sidebar-accent: var(--sidebar-accent);
      }
      :root {
        --radius: 0.625rem;
        --input-height: 2.75rem;
        --button-height: 2.5rem;
        --button-height-sm: 2.25rem;
        --font-size-base: 0.875rem;
        --flexoki-bg: 48 100% 97%;
        --flexoki-bg-2: 51 59% 95%;
        --flexoki-ui: 51 21% 88%;
        --flexoki-ui-2: 50 14% 83%;
        --flexoki-ui-3: 55 10% 79%;
        --flexoki-tx: 0 3% 6%;
        --flexoki-tx-2: 50 3% 42%;
        --flexoki-re: 3 62% 42%;
        --flexoki-gr: 73 84% 27%;
        --flexoki-ye: 45 99% 34%;
        --background: hsl(var(--flexoki-bg));
        --foreground: hsl(var(--flexoki-tx));
        --card: hsl(var(--flexoki-bg-2));
        --card-foreground: hsl(var(--flexoki-tx));
        --popover: hsl(var(--flexoki-bg-2));
        --popover-foreground: hsl(var(--flexoki-tx));
        --primary: hsl(var(--flexoki-tx));
        --primary-foreground: hsl(var(--flexoki-bg));
        --secondary: hsl(var(--flexoki-ui-2));
        --secondary-foreground: hsl(var(--flexoki-tx-2));
        --muted: hsl(var(--flexoki-ui));
        --muted-foreground: hsl(var(--flexoki-tx-2));
        --accent: hsl(var(--flexoki-ui));
        --accent-foreground: hsl(var(--flexoki-tx-2));
        --destructive: hsl(var(--flexoki-re));
        --destructive-foreground: hsl(var(--flexoki-bg));
        --success: hsl(var(--flexoki-gr));
        --success-foreground: hsl(var(--flexoki-bg));
        --warning: hsl(var(--flexoki-ye));
        --warning-foreground: hsl(var(--flexoki-bg));
        --border: hsl(var(--flexoki-ui));
        --input: hsl(var(--flexoki-ui));
        --input-bg: hsl(var(--flexoki-bg));
        --ring: hsl(var(--flexoki-ui-3));
        --sidebar: hsl(var(--flexoki-bg));
        --sidebar-accent: hsl(var(--flexoki-ui));
        --chart-1: #355c4c;
        --chart-2: #7e9f8c;
        --chart-3: #cbba8c;
        --chart-4: #c08a5f;
        --chart-5: #9a7e92;
      }
      @layer base {
        * { @apply border-border; }
        body { @apply bg-background text-foreground font-sans; font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
