ervice Configuration.","guide.ibkr.s8.cap2":"Check Flex Web Service Status, enable it if off, and save.","guide.ibkr.s8.check":"You now hold both Query ID and an active Current Token from the same login.","guide.ibkr.s8.prob":"Can't find a valid token?","guide.ibkr.s8.rec":"Confirm the service is enabled and the token has not expired. Generate a new one if needed (note: replacing a token affects other apps using it).","guide.ibkr.s9.title":"Verify IBKR Account","guide.ibkr.s9.body":"Enter both credentials below. Once verified, you can confirm the returned broker account.","guide.ibkr.s9.check":"Verification opens the account confirmation step.","guide.ibkr.s9.prob":"Credentials rejected?","guide.ibkr.s9.rec":"Verify the query and token belong to the same user login, check token expiry, IP restrictions, and the query's selected account.","guide.wb.s1.title":"Apply for OpenAPI Access","guide.wb.s1.body":"Log in to Webull AU web portal with your brokerage account. Open Developer Tool from the avatar menu and submit an OpenAPI application in API Management \u2192 My Application.","guide.wb.s1.cap1":"Open Developer Tool from the top-right avatar menu.","guide.wb.s1.cap2":"Submit a personal OpenAPI application under My Application.","guide.wb.s1.check":"My Application shows Approved, or you receive an approval email.","guide.wb.s1.prob":"Application still pending review?","guide.wb.s1.rec":"You can pause here and register the app once approved.","guide.wb.s2.title":"Register App & Generate Keys","guide.wb.s2.body":"Once approved, go to API Management \u2192 API Keys Management, register an app name, click Generate Key, verify, and save App Key and App Secret.","guide.wb.s2.cap1":"Register your app under API Keys Management first.","guide.wb.s2.cap2":"Locate your app row and click Generate Key.","guide.wb.s2.check":"Both App Key and App Secret are saved safely.","guide.wb.s2.prob":"Can't find Generate Key?","guide.wb.s2.rec":"Check your application approval status and ensu <script>// The Codex carousel supplies its own navigation. Add navigation only in the standalone document.
(() => {
  const root = document.getElementById("portfolio-overview-comparison");
  const screens = [...root.querySelectorAll("[data-variant]")];
  const nav = document.createElement("nav");
  nav.id = "d02-views";
  nav.setAttribute("aria-label", "对照布局");
  for (const section of screens) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = section.dataset.variant;
    button.setAttribute("aria-pressed", String(!section.hidden));
    button.onclick = () => {
      for (const [i, other] of screens.entries()) {
        other.hidden = other !== section;
        nav.children[i].setAttribute("aria-pressed", String(other === section));
      }
    };
    nav.append(button);
  }
  root.prepend(nav);
})();
</script></body></html>
