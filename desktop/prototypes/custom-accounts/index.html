<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Portfolio · 自定义账本原型</title>
<style>
:root{color-scheme:light;--paper:#f4f6f1;--panel:#fff;--ink:#172820;--muted:#51645a;--line:#dce4dc;--green:#21543e;--soft:#e8f2e9;--red:#a23631}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #41936a;outline-offset:2px}
button:disabled{cursor:default;opacity:.5}
header{border-bottom:1px solid var(--line);background:var(--panel)}
.head,.workspace{max-width:1170px;margin:auto;padding:0 28px}
.head{display:flex;justify-content:space-between;align-items:center;min-height:70px;gap:20px}
.brand{display:flex;align-items:center;gap:11px;font-weight:750}
.mark{display:grid;place-items:center;background:var(--green);color:white;width:32px;height:32px;border-radius:8px;font:700 14px "Segoe UI",sans-serif}
.brand span:last-child{font:700 16px "Segoe UI",sans-serif}
.workspace{padding-top:32px;padding-bottom:44px}
h1,h2,h3,p{margin:0}
h1{font-size:32px;letter-spacing:-.035em}
h2{font-size:23px;letter-spacing:-.02em}
h3{font-size:15px}
.caption,.muted,small{color:var(--muted)}
.caption{margin-top:6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,310px);gap:20px;margin-top:24px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
h2+p,.section-gap{margin-top:7px}
.tools,.heading,.button-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.heading{justify-content:space-between;gap:16px}
.tools{margin-top:18px}
.button-line{margin-top:22px}
button{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:39px;padding:8px 13px}
button.primary{background:var(--green);border-color:var(--green);color:white;font-weight:650}
button.primary:hover:not(:disabled){background:#184732}
button.subtle{background:transparent}
button.link{border:0;background:transparent;color:var(--green);padding-inline:2px}
button[aria-current="step"]{background:var(--soft);border-color:#bad1c0;color:#1a4b35;font-weight:680}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:19px}
nav button{min-height:34px;padding:4px 12px}
.account-options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:19px 0}
.option{border:1px solid var(--line);border-radius:9px;padding:11px;min-width:0}
.option strong,.option small{display:block}
.option.selected{background:var(--soft);border-color:#a6c4ad}
form{margin-top:19px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
label{display:grid;gap:5px;font-size:13px;font-weight:640}
input,select{width:100%;min-width:0;min-height:39px;border:1px solid #c8d4ca;border-radius:7px;background:#fff;color:var(--ink);padding:7px 9px}
figure{margin:0}
.summary{margin-top:13px}
dl{margin:0}
.metric{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:11px;margin-top:11px}
dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
dt{color:var(--muted)}
.side-note{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.activity{margin-top:18px;overflow:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:10px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:620;background:#f7f9f6}
.counts{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.good{color:var(--green);font-weight:650}.bad{color:var(--red);font-weight:650}
.status{min-height:24px;margin-top:14px;color:var(--green);font-weight:640}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;margin-top:17px;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:2}.head,.workspace{padding-inline:18px}}
@media(max-width:490px){.workspace{padding-top:19px}.card{padding:15px}.fields,.account-options{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><span class="mark" aria-hidden="true">SP</span><span>Stock Portfolio</span></div><button type="button" class="link" data-action="reset">重置演示</button></div></header>
<main class="workspace">
  <h1>自定义券商账户</h1>
  <p class="caption">通过示例走一遍建账、CSV 导入和手动录入。此原型使用临时示例数据。</p>
  <nav aria-label="演示流程" id="steps"></nav>
  <div class="layout"><section class="card" id="screen"><noscript>请启用 JavaScript 以操作演示。</noscript></section><aside class="card side" id="summary" aria-label="账本余额"></aside></div>
  <p class="status" id="notice" role="status"></p>
</main>
<script>
const examples = [
  { reference:"dep-001", date:"2026-11-02", type:"DEPOSIT", currency:"AUD", amount:1000 },
  { reference:"fx-001", date:"2026-11-03", type:"FX_CONVERSION", currency:"AUD", amount:300, fee:2, toCurrency:"USD", toAmount:195 },
  { reference:"trade-001", date:"2026-11-04", type:"BUY", currency:"USD", symbol:"AAPL", quantity:1, price:180, fee:1 },
];
const typeLabels = {DEPOSIT:"入金",WITHDRAWAL:"出金",BUY:"买入",SELL:"卖出",DIVIDEND:"股息",INTEREST:"利息",FEE:"费用",TAX:"税款",TRANSFER_IN:"转入",TRANSFER_OUT:"转出",FX_CONVERSION:"换汇"};
const initial = () => ({page:"create", account:null, records:[], preview:null, opening:null, notice:""});
const format = new Intl.NumberFormat("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const cashValue = (currency, amount) => currency + " " + format.format(amount);
const outgoing = new Set(["WITHDRAWAL","FEE","TAX","TRANSFER_OUT"]);
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
function totals(records, opening) {
  const cash = {AUD:0,USD:0}, positions = {};
  let contribution = 0;
  const add = (c,n) => { cash[c]=(cash[c] || 0)+n; };
  if (opening) {
    add(opening.currency,opening.amount);
    if (opening.symbol) positions[opening.symbol]=opening.quantity;
    if (opening.currency === "AUD") contribution=opening.amount;
  }
  for (const row of records) {
    const {type,currency,amount,symbol,quantity,price,fee=0,toCurrency,toAmount}=row;
    if (type === "BUY" || type === "SELL") {
      const sign=type === "BUY" ? 1 : -1;
      positions[symbol]=(positions[symbol] || 0)+sign*quantity;
      add(currency,-sign*quantity*price-fee);
    } else if (type === "FX_CONVERSION") {
      add(currency,-amount-fee);
      add(toCurrency,toAmount);
    } else {
      add(currency,(outgoing.has(type) ? -1 : 1)*amount);
      if (currency === "AUD" && ["DEPOSIT","WITHDRAWAL","TRANSFER_IN","TRANSFER_OUT"].includes(type))
        contribution+=(outgoing.has(type) ? -1 : 1)*amount;
    }
  }
  return {cash,positions,contribution};
}
function inspect(state, rows) {
  return rows.map((row) => {
    const previous = state.records.find((entry) => entry.reference === row.reference);
    const status = state.opening && row.date <= state.opening.date ? "date" : !previous ? "new" : same(previous,row) ? "duplicate" : "conflict";
    return {row,status};
  });
}
function reduce(state, action) {
  if (action.type === "reset") return initial();
  if (action.type === "create") return {...state,page:"actions",account:action.account,notice:"账户已创建，可以导入或手动添加记录。"};
  if (action.type === "navigate") return {...state,page:action.page,notice:""};
  if (action.type === "preview") {
    const rows=action.conflict ? [{...examples[0],amount:999},...examples.slice(1)] : examples;
    const preview=inspect(state,rows);
    return {...state,page:"csv",preview,notice:""};
  }
  if (action.type === "commit") {
    const preview=state.preview;
    if (preview.some(({status}) => status === "conflict" || status === "date")) return state;
    const added=preview.filter(({status}) => status === "new").map(({row}) => row);
    return {...state,page:"history",records:[...state.records,...added],notice:"已导入 "+added.length+" 条记录。"};
  }
  if (action.type === "manual") {
    const status=inspect(state,[action.row])[0].status;
    if (status !== "new") return {...state,notice:status === "date" ? "记录日期必须晚于期初余额。" : "该编号已存在，请检查记录。"};
    return {...state,page:"history",records:[...state.records,action.row],notice:"手动录入已保存。"};
  }
  if (action.type === "opening") {
    if (state.opening || state.records.some((row) => row.date <= action.opening.date)) return {...state,notice:"期初日期必须早于已有流水，且每个账户只设置一次。"};
    return {...state,page:"actions",opening:action.opening,notice:"期初余额已保存。"};
  }
  return state;
}

const screen=document.querySelector("#screen");
const summary=document.querySelector("#summary");
const steps=document.querySelector("#steps");
const notice=document.querySelector("#notice");
let state=initial();
const escape=(value) => String(value??"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const btn=(title,action,extra="")=>'<button type="button" data-action="'+action+'" '+extra+'>'+title+'</button>';
const textField=(label,name,value="",extra="")=>'<label>'+label+'<input name="'+name+'" value="'+escape(value)+'" '+extra+'></label>';
const moneyField=(label,name,value="")=>textField(label,name,value,'type="number" min="0.01" step="any" required');
const dateField=(value)=>textField("日期","date",value,'type="date" required');
const currencyField=(selected)=>'<label>币种<select name="currency"><option>AUD</option><option '+(selected==="USD"?'selected':'')+'>USD</option></select></label>';
const totalsMetric=(name,amount)=>"<div class='metric'><dt>"+name+"</dt><dd>"+amount+"</dd></div>";
function describe(row) {
  const fee=row.fee?" · 费用 "+cashValue(row.currency,row.fee):"";
  if (row.type === "BUY" || row.type === "SELL") return escape(row.symbol)+" · "+row.quantity+" × "+cashValue(row.currency,row.price)+fee;
  if (row.type === "FX_CONVERSION") return cashValue(row.currency,row.amount)+" → "+cashValue(row.toCurrency,row.toAmount)+fee;
  return cashValue(row.currency,row.amount);
}
function table(entries, preview=false) {
  const labels={new:"新增",duplicate:"重复",conflict:"编号冲突",date:"早于或等于期初"};
  if (!entries.length) return '<p class="empty">账本目前没有流水。可以导入 CSV 或手动录入。</p>';
  const rows=entries.map(({row,status})=>"<tr><td>"+row.date+"</td><td>"+typeLabels[row.type]+"</td><td>"+describe(row)+"</td><td>"+escape(row.reference)+"</td>"+
    (preview ? '<td class="'+(status==="new"?"good":status==="duplicate"?"muted":"bad")+'">'+labels[status]+"</td>" : "")+"</tr>").join("");
  return '<div class="activity"><table><thead><tr><th>日期</th><th>类型</th><th>金额或持仓</th><th>记录编号</th>'+(preview?"<th>状态</th>":"")+"</tr></thead><tbody>"+rows+"</tbody></table></div>";
}
function render() {
  const {page,account,records,preview,opening}=state;
  const nav=[["新增账户","create"],["录入方式","actions"],["CSV 导入","csv"],["手动录入","manual"],["账本历史","history"]];
  steps.innerHTML=nav.map(([name,id])=>btn(name,id,(page===id?'aria-current="step" ':'')+(!account&&id!=="create"?"disabled":""))).join("");
  const value=totals(records,opening);
  const holdings=Object.entries(value.positions).filter(([,qty])=>qty!==0);
  summary.innerHTML="<h3>账本余额</h3><p class='muted section-gap'>"+(account?escape(account.name):"待创建自定义账户")+"</p>"+
    "<dl class='summary'>"+totalsMetric("AUD 现金",cashValue("AUD",value.cash.AUD))+totalsMetric("USD 现金",cashValue("USD",value.cash.USD))+
    totalsMetric("证券持仓",holdings.length?holdings.map(([symbol,qty])=>escape(symbol)+" · "+qty+" 股").join("<br>"):"—")+
    totalsMetric("AUD 净现金投入",cashValue("AUD",value.contribution))+"</dl>"+
    "<p class='side-note'>净现金投入只合计本演示中以 AUD 记录的外部现金。账户内换汇不计入外部投入。</p>";
  notice.textContent=state.notice;
  if(page==="create"){
    screen.innerHTML='<h2>新增账户</h2><p class="muted">在券商选项旁选择自定义账户。</p><div class="account-options"><div class="option"><strong>IBKR</strong><small>券商连接</small></div><div class="option"><strong>Webull AU</strong><small>券商连接</small></div><div class="option selected"><strong>自定义账户</strong><small>CSV 或手动录入</small></div></div><form id="account"><div class="fields">'+
      textField("账户名称","name",account?.name||"Harbour 投资账户","required maxlength=120")+
      textField("券商名称（选填）","broker",account?.broker||"Harbour Securities","maxlength=120")+
      currencyField(account?.currency||"AUD")+'</div><div class="button-line"><button class="primary" type="submit">'+(account?"进入演示账户":"创建账户")+'</button></div></form>';
  } else if(page==="actions"){
    screen.innerHTML="<h2>"+escape(account.name)+"</h2><p class='muted'>"+escape(account.broker)+" · 默认币种 "+account.currency+"</p><div class='tools'>"+
      btn("导入 CSV","csv",'class="primary"')+btn("手动录入","manual")+btn("期初余额","opening")+btn("查看历史","history")+'</div><p class="section-gap muted">'+
      (opening?"期初余额日期 "+opening.date:"已有现金或持仓时，可以先设置期初余额。")+"</p>";
  } else if(page==="csv"){
    const count=(status)=>preview?.filter((item)=>item.status===status).length||0;
    const errors=count("conflict")+count("date");
    screen.innerHTML="<h2>CSV 导入</h2><p class='muted'>入账至 "+escape(account.name)+"</p><div class='tools'>"+
      btn("下载空白 CSV 模板","template")+btn("预览示例 CSV","sample",'class="primary"')+
      btn("预览编号冲突","conflict",records.length?"":"disabled")+"</div>"+
      (preview?'<p class="counts"><span class="good">新增 '+count("new")+'</span><span>重复 '+count("duplicate")+'</span><span class="'+(errors?"bad":"muted")+'">无效 '+errors+"</span></p>"+
      table(preview,true)+(errors?'<p class="bad section-gap">请修正文件后再导入。此批次没有写入账本。</p>':"")+
      '<div class="button-line">'+btn("确认导入","commit",'class="primary" '+(errors||!count("new")?"disabled":""))+btn("取消预览","cancel-preview")+"</div>":
      '<p class="empty">选择示例 CSV，会看到三条记录及预览状态。确认后才会写入账本。</p>');
  } else if(page==="manual"){
    manualScreen("DEPOSIT");
  } else if(page==="opening"){
    screen.innerHTML='<h2>期初余额</h2><p class="muted">填写开始记录当天已有的现金和持仓。</p><form id="opening"><div class="fields">'+
      dateField("2026-11-01")+currencyField(account.currency)+moneyField("现金余额","amount",500)+
      textField("证券代码（选填）","symbol","")+textField("数量（选填）","quantity","","type=number min=0 step=any")+
      '</div><div class="button-line"><button class="primary" type="submit">保存期初余额</button>'+btn("返回","actions")+"</div></form>";
  } else if(page==="history"){
    screen.innerHTML='<div class="heading"><div><h2>账本历史</h2><p class="muted">'+escape(account.name)+' · '+records.length+' 条流水</p></div>'+
      btn("手动录入","manual",'class="primary"')+"</div>"+table(records.map((row)=>({row})))+'<div class="button-line">'+btn("再次预览相同 CSV","sample")+btn("返回录入方式","actions")+"</div>";
  }
}
function manualScreen(type) {
  const trade=type==="BUY"||type==="SELL";
  const fx=type==="FX_CONVERSION";
  const options=Object.entries(typeLabels).map(([key,name])=>'<option value="'+key+'" '+(key===type?"selected":"")+'>'+name+"</option>").join("");
  screen.innerHTML='<h2>手动录入</h2><p class="muted">入账至 '+escape(state.account.name)+'</p><form id="manual"><div class="fields"><label>记录类型<select name="type">'+options+
    '</select></label>'+dateField("2026-11-06")+currencyField(state.account.currency)+
    (trade?textField("证券代码","symbol","AAPL","required")+moneyField("数量","quantity",1)+moneyField("成交价","price",180):moneyField(fx?"卖出金额":"金额","amount",fx?300:250))+
    (fx?textField("买入币种","toCurrency","USD","required maxlength=3")+moneyField("买入金额","toAmount",195):"")+
    (trade||fx?textField("费用（选填）","fee",fx?2:1,'type="number" min="0" step="any"'):"")+
    textField("记录编号（选填）","reference")+'</div><p class="section-gap good" id="effect"></p><div class="button-line"><button class="primary" type="submit">保存到此账户</button>'+btn("取消","actions")+"</div></form>";
  refreshEffect();
}
function manualRow(data) {
  const type=data.get("type");
  const row={reference:data.get("reference")||"manual-"+(state.records.length+1),date:data.get("date"),type,currency:data.get("currency")};
  if(type==="BUY"||type==="SELL") return {...row,symbol:String(data.get("symbol")).toUpperCase(),quantity:Number(data.get("quantity")),price:Number(data.get("price")),fee:Number(data.get("fee"))};
  if(type==="FX_CONVERSION") return {...row,amount:Number(data.get("amount")),fee:Number(data.get("fee")),toCurrency:String(data.get("toCurrency")).toUpperCase(),toAmount:Number(data.get("toAmount"))};
  return {...row,amount:Number(data.get("amount"))};
}
function refreshEffect(){
  const form=document.getElementById("manual");
  const row=manualRow(new FormData(form));
  document.getElementById("effect").textContent="入账预览 · "+typeLabels[row.type]+" "+describe(row).replace(/&amp;/g,"&");
}
function dispatch(action) { state=reduce(state,action); render(); }
document.addEventListener("click",(event)=>{
  const action=event.target.closest("button[data-action]")?.dataset.action;
  if(!action)return;
  if(action==="reset")return dispatch({type:"reset"});
  if(action==="sample"||action==="conflict")return dispatch({type:"preview",conflict:action==="conflict"});
  if(action==="cancel-preview"){state={...state,preview:null};return render();}
  if(action==="commit")return dispatch({type:"commit"});
  if(action==="template"){
    const blob=new Blob(["record_id,date,type,currency,symbol,mic,asset_kind,quantity,unit_price,amount,fee,transfer_group,to_currency,to_amount,note\r\n"],{type:"text/csv"});
    const url=URL.createObjectURL(blob), link=document.createElement("a");
    link.href=url;link.download="stock-portfolio-template.csv";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    return;
  }
  dispatch({type:"navigate",page:action});
});
screen.addEventListener("submit",(event)=>{
  event.preventDefault();
  const data=new FormData(event.target);
  if(event.target.id==="account"){
    if(state.account)return dispatch({type:"navigate",page:"actions"});
    const name=String(data.get("name")).trim();
    if(name)dispatch({type:"create",account:{name,broker:data.get("broker"),currency:data.get("currency")}});
  }
  if(event.target.id==="manual"){
    const row=manualRow(data);
    if(row.type==="FX_CONVERSION"&&row.currency===row.toCurrency){notice.textContent="请选择不同的买入币种。";return;}
    dispatch({type:"manual",row});
  }
  if(event.target.id==="opening")dispatch({type:"opening",opening:{date:data.get("date"),currency:data.get("currency"),amount:Number(data.get("amount")),symbol:String(data.get("symbol")).trim().toUpperCase(),quantity:Number(data.get("quantity"))}});
});
screen.addEventListener("change",(event)=>{if(event.target.form?.id==="manual"&&event.target.name==="type")manualScreen(event.target.value);});
screen.addEventListener("input",(event)=>{if(event.target.form?.id==="manual"&&event.target.name!=="type")refreshEffect();});
render();
</script>
</body></html>
